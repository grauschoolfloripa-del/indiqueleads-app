<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0C486C" />
    <title>Sem conexão — IndiqueLeads</title>
    <style>
      :root {
        --navy: #0c486c;
        --green: #48a848;
        --ink: #0c1a24;
        --soft: #5b6d79;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f7f9;
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      .card {
        max-width: 22rem;
      }
      img {
        width: 88px;
        height: 88px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.35rem;
        line-height: 1.25;
        margin: 0 0 10px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 22px;
        color: var(--soft);
        font-size: 0.95rem;
        line-height: 1.55;
      }
      button {
        background: var(--navy);
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 13px 26px;
        font-size: 0.92rem;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
      }
      button:hover {
        background: #0a3c5b;
      }
      button:focus-visible {
        outline: 3px solid var(--green);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="IndiqueLeads" width="88" height="88" />
      <h1>Você está sem internet</h1>
      <p>
        As telas que você já abriu continuam disponíveis. Para carregar leads, saldo e novidades,
        precisamos da conexão de volta.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
